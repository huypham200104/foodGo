recipe: default.v1
assistant_id: 20251021-134950-matte-watt
language: vi

# Cấu hình tham số
pipeline:
  # 1️⃣ Tokenizer tiếng Việt (nếu bạn có file actions/vietnamese_tokenizer.py)
  # Nếu chưa có, bạn nên thay bằng WhitespaceTokenizer để tránh lỗi import.
  # Tham số truyền vào
  - name: actions.vietnamese_tokenizer.VietnameseTokenizer
    intent_tokenization_flag: False
    intent_split_symbol: "_"

  # 2️⃣ Dùng PhoBERT để hiểu tiếng Việt tự nhiên
  - name: LanguageModelFeaturizer
    model_name: "bert"
    model_weights: "vinai/phobert-base"

  # 3️⃣ Regex để nhận dạng số lượng, kích cỡ, từ khóa đặc biệt
  - name: RegexFeaturizer

  # 4️⃣ Đặc trưng cú pháp cơ bản
  - name: LexicalSyntacticFeaturizer

  # 5️⃣ CountVectorsFeaturizer ký tự để nhận dạng lỗi chính tả (bo bam ~ bò băm)
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 6

  # 6️⃣ RegexEntityExtractor hỗ trợ bảng lookup (menu, món ăn,...)
  - name: RegexEntityExtractor
    case_sensitive: False
    use_lookup_tables: True
    use_regexes: True

  # 7️⃣ DIETClassifier cho intent + entity
  - name: DIETClassifier
    epochs: 200
    entity_recognition: True
    constrain_similarities: True
    learning_rate: 0.001
    hidden_layers_sizes:
      text: [256, 128]

  # 8️⃣ Gom đồng nghĩa cho entity
  - name: EntitySynonymMapper

  # 9️⃣ ResponseSelector cho các câu FAQ
  - name: ResponseSelector
    epochs: 200
    constrain_similarities: True

  # 🔟 FallbackClassifier khi độ tin cậy thấp
  - name: FallbackClassifier
    threshold: 0.4
    ambiguity_threshold: 0.1

# 
policies:
  - name: MemoizationPolicy
  - name: RulePolicy
  - name: UnexpecTEDIntentPolicy
    max_history: 15
    epochs: 200
  - name: TEDPolicy
    max_history: 15
    epochs: 200
    constrain_similarities: True
    learning_rate: 0.0001
