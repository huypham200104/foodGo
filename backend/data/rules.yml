version: "3.1"

rules:
  - rule: greet
    steps:
      - intent: greet
      - action: utter_greet

  - rule: goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: thank
    steps:
      - intent: thank
      - action: utter_thank

  - rule: ask menu
    steps:
      - intent: ask_menu
      - action: action_show_menu

  - rule: ask price
    steps:
      - intent: ask_price
      - action: action_get_price

  - rule: ask opening hours
    steps:
      - intent: ask_opening_hours
      - action: utter_opening_hours

  - rule: order food
    steps:
      - intent: order_food
      - action: action_order_food

  - rule: confirm order
    steps:
      - intent: confirm_order
      - action: utter_confirm_order

  # --- CÁC ACTION MỚI (Trả về JSON) ---

  # Sửa: Dùng action mới thay cho utter_cancel
  - rule: Cancel order
    steps:
      - intent: cancel_order
      - action: action_cancel_order

  # Sửa: Dùng action mới thay cho utter_out_of_scope
  - rule: Ask the bot to handle low confidence
    steps:
      - intent: nlu_fallback
      - action: action_custom_fallback

  # Xử lý ngoại lệ chủ động (khi người dùng nói linh tinh)
  - rule: handle out of scope
    steps:
      - intent: out_of_scope
      - action: action_custom_fallback

  - rule: ask recommendation popular
    steps:
      - intent: ask_recommendation
      - action: action_recommend_popular

  - rule: ask recommendation new
    steps:
      - intent: ask_new_items
      - action: action_recommend_new

  - rule: ask ingredients
    steps:
      - intent: ask_ingredients
      - action: action_ask_ingredients

  - rule: Ask for vouchers
    steps:
      - intent: ask_vouchers
      - action: action_show_vouchers

  - rule: Check membership
    steps:
      - intent: check_membership
      - action: action_check_membership

  - rule: Search food by price
    steps:
      - intent: search_by_price
      - action: action_search_by_price

  - rule: Show more items
    steps:
      - intent: ask_more
      - action: action_show_more_items