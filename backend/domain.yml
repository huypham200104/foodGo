version: "3.1"

intents:
  - greet
  - goodbye
  - thank
  - order_food
  - ask_menu
  - ask_more_menu
  - ask_price
  - deny
  - confirm_order
  - cancel_order
  - ask_opening_hours
  - out_of_scope
  - ask_recommendation
  - ask_new_items
  - ask_ingredients
  - ask_vouchers
  - check_membership
  - search_by_price
  - ask_more

slots:
  search_max_price:
    type: float
    mappings:
      - type: custom
  search_offset:
    type: float
    mappings:
      - type: custom
  menu_offset:
    type: float
    initial_value: 0
    mappings:
      - type: custom
  food:
    type: text
    mappings:
      - type: from_entity
        entity: food
  quantity:
    type: any
    mappings:
      - type: from_entity
        entity: quantity
  category:
    type: text
    mappings:
      - type: from_entity
        entity: category


responses:
  utter_greet:
    - text: "Chào bạn! Bạn muốn xem menu, gợi ý món hay đặt món nào không?"

  utter_goodbye:
    - text: "Tạm biệt bạn! Hẹn gặp lại nhé!"

  utter_thank:
    - text: "Cảm ơn bạn nhiều nha!"

  utter_confirm_order:
    - text: "Bạn muốn đặt {quantity} phần {food}, đúng không ạ?"

  utter_opening_hours:
    - text: "Quán mở cửa từ 8:00 sáng đến 10:00 tối mỗi ngày."

actions:
  - action_show_menu
  - action_show_more_menu
  - action_get_price
  - action_order_food
  - action_recommend_popular
  - action_recommend_new
  - action_ask_ingredients
  - action_show_vouchers
  - action_check_membership
  - action_search_by_price
  - action_show_more_items
  - action_cancel_order
  - action_custom_fallback

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true